<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1C1A17" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- warm off-white tile, rounded like an app icon -->
  <rect width="512" height="512" rx="112" fill="#FBF7F1"/>
  <!-- curved friendships, drawn under the dots -->
  <g fill="none" stroke="#C9BFB0" stroke-linecap="round">
    <path d="M186 214 Q 232 150 300 178" stroke-width="10"/>
    <path d="M186 214 Q 200 296 280 314" stroke-width="12"/>
    <path d="M300 178 Q 356 228 280 314" stroke-width="7"/>
    <path d="M300 178 Q 362 156 372 232" stroke-width="7"/>
    <path d="M280 314 Q 344 300 372 232" stroke-width="9"/>
    <path d="M186 214 Q 130 260 176 330" stroke-width="6"/>
    <path d="M176 330 Q 224 356 280 314" stroke-width="6"/>
    <path d="M300 178 Q 268 118 226 130" stroke-width="5"/>
  </g>
  <!-- people: one pastel per friend group, sized by how connected they are -->
  <g filter="url(#shadow)">
    <circle cx="186" cy="214" r="52" fill="#B8EBD0"/>
    <circle cx="280" cy="314" r="58" fill="#CFC5F5"/>
    <circle cx="300" cy="178" r="44" fill="#F7C6CF"/>
    <circle cx="372" cy="232" r="36" fill="#F7E39B"/>
    <circle cx="176" cy="330" r="34" fill="#BFDCF5"/>
    <circle cx="226" cy="130" r="26" fill="#F9CFB0"/>
    <circle cx="352" cy="338" r="22" fill="#D6E6A8"/>
  </g>
  <!-- soft highlight so the spheres read as 3D, like the site -->
  <g fill="#FFFFFF" opacity="0.55">
    <ellipse cx="172" cy="196" rx="18" ry="11" transform="rotate(-25 172 196)"/>
    <ellipse cx="264" cy="294" rx="20" ry="12" transform="rotate(-25 264 294)"/>
    <ellipse cx="288" cy="164" rx="15" ry="9" transform="rotate(-25 288 164)"/>
    <ellipse cx="362" cy="220" rx="12" ry="7" transform="rotate(-25 362 220)"/>
    <ellipse cx="166" cy="318" rx="11" ry="7" transform="rotate(-25 166 318)"/>
    <ellipse cx="219" cy="121" rx="9" ry="5" transform="rotate(-25 219 121)"/>
    <ellipse cx="346" cy="331" rx="7" ry="4" transform="rotate(-25 346 331)"/>
  </g>
</svg>
